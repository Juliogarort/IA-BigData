version: "3.9"

#------------------- SPARK CLUSTER -------------------#
services:
  # Inicializa el volumen de event logs
  init-spark-events:
    image: busybox:1.36
    container_name: init-spark-events
    command: ["sh", "-c", "mkdir -p /opt/spark-events && chmod 1777 /opt/spark-events"]
    volumes:
      - spark-events:/opt/spark-events
    restart: "no"

  # Spark Master
  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_PUBLIC_DNS=localhost
    command:
      ["/opt/spark/sbin/start-master.sh",
       "--host", "spark-master",
       "--port", "7077",
       "--webui-port", "8080"]
    ports:
      - "7077:7077"
      - "8080:8080"
      - "4040:4040"
      - "4041:4041"
      - "4042:4042"
    volumes:
      - spark-events:/opt/spark-events
      - spark-logs:/opt/spark/logs
    networks:
      - spark-net
    depends_on:
      - init-spark-events

  # Spark Worker 1
  spark-worker-1:
    image: apache/spark:3.5.3
    container_name: spark-worker-1
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_PUBLIC_DNS=localhost
    command:
      ["/opt/spark/sbin/start-worker.sh",
       "spark://spark-master:7077",
       "--webui-port", "8081",
       "--cores", "2",
       "--memory", "2G"]
    ports:
      - "8081:8081"
    volumes:
      - spark-events:/opt/spark-events
      - spark-logs:/opt/spark/logs
    networks:
      - spark-net
    depends_on:
      - spark-master

  # Spark Worker 2
  spark-worker-2:
    image: apache/spark:3.5.3
    container_name: spark-worker-2
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_PUBLIC_DNS=localhost
    command:
      ["/opt/spark/sbin/start-worker.sh",
       "spark://spark-master:7077",
       "--webui-port", "8082",
       "--cores", "2",
       "--memory", "2G"]
    ports:
      - "8082:8082"
    volumes:
      - spark-events:/opt/spark-events
      - spark-logs:/opt/spark/logs
    networks:
      - spark-net
    depends_on:
      - spark-master

  # Spark History Server
  history-server:
    image: apache/spark:3.5.3
    container_name: spark-history
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_HISTORY_OPTS=-Dspark.history.fs.logDirectory=file:///opt/spark-events -Dspark.history.ui.port=18080
    command: ["/opt/spark/sbin/start-history-server.sh"]
    ports:
      - "18080:18080"
    volumes:
      - spark-events:/opt/spark-events
    networks:
      - spark-net
    depends_on:
      - spark-master

#------------------- ELK (LOGS) -------------------#
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - spark-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - spark-net
    depends_on:
      - elasticsearch

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: filebeat
    user: root
    command: ["--strict.perms=false"]
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - spark-net
    depends_on:
      - elasticsearch

#------------------- NGINX SERVER -------------------#
  nginx:
    image: nginx:latest
    container_name: nginx-web-server
    ports:
      - "8089:80"
    networks:
      - spark-net

networks:
  spark-net:

volumes:
  spark-events:
  spark-logs:
  es-data: