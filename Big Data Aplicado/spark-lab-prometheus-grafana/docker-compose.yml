#------------------- SPARK CLUSTER -------------------#
services:
  # 0) Inicializa el volumen de event logs con permisos 1777
  init-spark-events:
    image: busybox:1.36
    container_name: init-spark-events
    command: ["sh", "-c", "mkdir -p /opt/spark-events && chmod 1777 /opt/spark-events"]
    volumes:
      - spark-events:/opt/spark-events
    restart: "no"

  # 1) Spark Master
  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_PUBLIC_DNS=localhost
    command:
      ["/opt/spark/sbin/start-master.sh",
       "--host", "spark-master",
       "--port", "7077",
       "--webui-port", "8080"]
    ports:
      - "7077:7077"   # RPC del master
      - "8080:8080"   # Master UI
      - "4040:4040"   # App UI (cuando el driver corra en el master)
      - "4041:4041"   # App UI (ejecución simultanea en el master)
      - "4042:4042"   # App UI (ejecución simultanea en el master)
    volumes:
      - spark-events:/opt/spark-events
    networks:
      - spark-net
    depends_on:
      - init-spark-events

  # 2) Spark Worker 1
  spark-worker-1:
    image: apache/spark:3.5.3
    container_name: spark-worker-1
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_PUBLIC_DNS=localhost
    command:
      ["/opt/spark/sbin/start-worker.sh",
       "spark://spark-master:7077",
       "--webui-port", "8081",
       "--cores", "2",
       "--memory", "2G"]
    ports:
      - "8081:8081"   # Worker UI
    volumes:
      - spark-events:/opt/spark-events
    networks:
      - spark-net
    depends_on:
      - spark-master
      - init-spark-events

  # 3) Spark Worker 2
  spark-worker-2:
    image: apache/spark:3.5.3
    container_name: spark-worker-2
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_PUBLIC_DNS=localhost
    command:
      ["/opt/spark/sbin/start-worker.sh",
       "spark://spark-master:7077",
       "--webui-port", "8082",
       "--cores", "2",
       "--memory", "2G"]
    ports:
      - "8082:8082"   # Worker 2 UI
    volumes:
      - spark-events:/opt/spark-events
    networks:
      - spark-net
    depends_on:
      - spark-master
      - init-spark-events

  # 4) Spark History Server
  history-server:
    image: apache/spark:3.5.3
    container_name: spark-history
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_PUBLIC_DNS=localhost
      - SPARK_HISTORY_OPTS=-Dspark.history.fs.logDirectory=file:///opt/spark-events -Dspark.history.ui.port=18080
    command: ["/opt/spark/sbin/start-history-server.sh"]
    ports:
      - "18080:18080" # History UI
    volumes:
      - spark-events:/opt/spark-events
    depends_on:
      - spark-master
      - init-spark-events
    networks:
      - spark-net


# --- OBSERVABILIDAD ---
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8088:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - spark-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    networks:
      - spark-net

  web-server-1:
    image: prom/node-exporter:latest
    container_name: web-server-1
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro'
    expose:
      - '9100'
    networks:
      - spark-net


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - spark-net


networks:
  spark-net:

volumes:
  spark-events:
  prom-data:
  grafana-data: